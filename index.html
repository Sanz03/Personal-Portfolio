  <script>
    const blob = document.querySelector('.profile-container');
    const showButton = document.querySelector('.show-button');
    const sProfile = document.querySelector('.s-profile-image');
    const profile = document.querySelector('.profile-image')
    
    blob.addEventListener('mousemove', (event) => {
      const target = event.currentTarget;
      const rect = target.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      target.style.setProperty('--mouse-x', `${x}px`);
      target.style.setProperty('--mouse-y', `${y}px`);
    });

    showButton.addEventListener('click', () => {
      if (showButton.innerHTML === 'Hide') {
        blob.classList.remove('after-container');
        sProfile.classList.remove('after-s-profile');
        profile.classList.remove('after-profile');
        showButton.innerHTML = 'Show';
      } else {
        blob.classList.add('after-container');
        sProfile.classList.add('after-s-profile');
        profile.classList.add('after-profile');
        showButton.innerHTML = 'Hide';
      }
    });
  </script>
